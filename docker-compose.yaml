services:
  broker:
    image: eclipse-mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config/
      - ./mosquitto/data:/mosquitto/data
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "test", "-C", "1", "-W", "5"]
      interval: 30s
      timeout: 10s
      retries: 3
  
  data-generator:
    build:
      context: ./data-generator
    ports:
      - "8080:8080"
    depends_on:
      - broker

  alarm-api:
    build:
      context: ./alarm-api
    environment:
      LOG_LEVEL: debug
    ports:
      - "8081:8080"
    depends_on:
      - broker

  frontend:
    build:
      context: frontend
    environment:
      NEXT_PUBLIC_BASE_API_URL: alarm-api:8081
    ports:
      - "3000:3000"
