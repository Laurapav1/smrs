services:
  broker:
    image: eclipse-mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config/
      - ./mosquitto/data:/mosquitto/data
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-h", "localhost", "-t", "test", "-C", "1", "-W", "5"]
      interval: 30s
      timeout: 10s
      retries: 3
  
  goapi:
    build:
      context: ./data-generator
    ports:
      - "8080:8080"
    depends_on:
      - broker