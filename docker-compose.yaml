services:
  broker:
    image: eclipse-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config/
      - /mosquitto/data
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "test", "-C", "1", "-W", "5"]
      interval: 30s
      timeout: 10s
      retries: 3
  
  data-generator:
    build:
      context: ./data-generator
    ports:
      - "8080:8080"
    depends_on:
      - broker

  alarm-api:
    build:
      context: ./alarm-api
    environment:
      LOG_LEVEL: debug
    ports:
      - "8081:8080"
    depends_on:
      - broker
      - opensearch

  frontend:
    build:
      context: frontend
      args:
        NEXT_PUBLIC_BASE_API_URL: http://alarm-api:8080
    ports:
      - "3000:3000"


  opensearch:
    image: opensearchproject/opensearch:latest
    environment:
      node.name: opensearch-node1
      cluster.initial_cluster_manager_nodes: opensearch-node1
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: Hej123456789!
    ports:
      - 9200:9200
    healthcheck:
      interval: 10s
      retries: 80
      test: curl --write-out 'HTTP %{http_code}' --fail --silent --output /dev/null http://localhost:8200/

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:latest
    container_name: opensearch-dashboards
    ports:
      - 5601:5601
    expose:
      - "5601"
    environment:
      OPENSEARCH_HOSTS: '["https://opensearch:9200"]'